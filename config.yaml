# Dataset
data_dir: './dataset'
max_length: 512
train_split: 0.9

# Model
'siglip_model': 'google/siglip-base-patch16-224'
'd_model': 512
'nhead': 8
'num_decoder_layers': 6
'dim_feedforward': 2048
'dropout': 0.2

# Training
'batch_size': 8
'num_epochs': 500
'learning_rate': 0.0001
'weight_decay': 0.0001
'warmup_epochs': 2
'save_every': 5

# Device
'device': 'cuda'

# Output
'save_dir': './checkpoints'
'log_file': './training.log'